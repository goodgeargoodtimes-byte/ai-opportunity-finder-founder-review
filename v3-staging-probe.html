<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>V3 Staging Probe</title><style>body{font:15px/1.5 Arial;margin:24px;background:#eef2f7;color:#102235}main{max-width:920px;margin:auto;background:#fff;padding:24px;border-radius:16px}button{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;border:1px solid #ccd8e2;background:#f7fafc;border-radius:9px;cursor:pointer}pre{white-space:pre-wrap;background:#0e2340;color:#fff;padding:14px;border-radius:10px;min-height:120px}a{display:inline-block;margin:10px 12px 0 0}</style></head><body><main><h1>V3 staging probe</h1><p>Internal QA only. No production tester link points here.</p><div id=buttons></div><pre id=out>Choose a scenario.</pre><div id=links></div></main><script>
const BACKEND='https://aof-v3-staging-0ris-production.up.railway.app';
const base={size:'2–5',ai:'Tried it a few times',frequency:'About daily',barrier:"I don't know how to set it up",help:'A personalised implementation pack',wtp:'A$25–49'};
const cases={
'microsoft_enquiries':{industry:'Professional services',stack:['Microsoft 365'],pains:['customer_enquiries','email_admin'],priority:'customer_enquiries'},
'google_email':{industry:'Professional services',stack:['Google Workspace'],pains:['email_admin'],priority:'email_admin'},
'servicem8_quotes':{industry:'Trades / home services',stack:['Job management / field service software'],software_detail:{job_management:'ServiceM8'},pains:['quotes_proposals','customer_enquiries'],priority:'quotes_proposals'},
'servicem8_scheduling':{industry:'Trades / home services',stack:['Job management / field service software'],software_detail:{job_management:'ServiceM8'},pains:['scheduling'],priority:'scheduling'},
'shopify_ecommerce':{industry:'Retail / ecommerce',stack:['Shopify / ecommerce platform'],software_detail:{ecommerce:'Shopify'},pains:['ecommerce'],priority:'ecommerce'},
'canva_marketing':{industry:'Professional services',stack:['Canva / creative tools'],pains:['marketing_content','email_admin'],priority:'marketing_content'},
'notion_knowledge':{industry:'Professional services',stack:['Project / task management'],software_detail:{project_task:'Notion'},pains:['knowledge','meetings_notes'],priority:'knowledge'},
'solo_no_stack':{industry:'Trades / home services',size:'Just me',stack:['None'],pains:['customer_enquiries'],priority:'customer_enquiries'},
'three_pains':{industry:'Professional services',stack:['Microsoft 365','Canva / creative tools'],pains:['email_admin','meetings_notes','marketing_content'],priority:'email_admin'},
'regulated_finance':{industry:'Financial / accounting',stack:['Microsoft 365'],pains:['email_admin','forms_data'],priority:'email_admin'}
};
const btns=document.getElementById('buttons'),out=document.getElementById('out'),links=document.getElementById('links');
Object.entries(cases).forEach(([name,extra])=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>run(name,extra);btns.appendChild(b)});
async function run(name,extra){out.textContent='Running '+name+'…';links.innerHTML='';const assessment={...base,...extra};try{const r=await fetch(BACKEND+'/v1/sessions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({tester_id:'V3-QA-'+name,brand_variant:2,source:'v3-internal-qa',intent:'paid-preview',assessment})});const text=await r.text();let j;try{j=JSON.parse(text)}catch{j={raw:text}};out.textContent='HTTP '+r.status+'\n'+JSON.stringify(j,null,2);if(r.ok){for(const [label,url] of [['Open pack',j.pack_url],['Open feedback',j.feedback_url]])if(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent=label;links.appendChild(a)}}}catch(e){out.textContent='ERROR\n'+e.message}}
</script></body></html>
